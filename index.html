<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Den">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Debt Den</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one phone-width column; sticky 8-bit HUD, a 160x90 pixel scene per location, chunky bordered windows below. Single dark retro look by design (16-color palette). */
:root{
  --k:#1a1c2c; --p:#5d275d; --r:#b13e53; --o:#ef7d57; --y:#ffcd75; --l:#a7f070; --g:#38b764; --t:#257179;
  --n:#29366f; --b:#3b5dc9; --c:#41a6f6; --a:#73eff7; --w:#f4f4f4; --s:#94b0c2; --d:#566c86; --e:#333c57;
  --px:'Press Start 2P','Courier New',monospace;
  --vt:'VT323','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--k);color:var(--w);font-family:var(--vt);font-size:21px;line-height:1.15;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--k)}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 36px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
b{font-weight:400}
.px{font-family:var(--px)}
.muted{color:var(--s)}
.win{color:var(--l)}
.lose{color:var(--o)}

/* buttons */
.btn{font-family:var(--px);font-size:11px;line-height:1.5;min-height:48px;padding:10px 12px;background:var(--y);color:var(--k);border:3px solid var(--k);box-shadow:inset -3px -3px 0 rgba(26,28,44,.35),inset 3px 3px 0 rgba(255,255,255,.4),0 0 0 3px var(--w);text-transform:uppercase;margin:3px}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.blue{background:var(--c)}
.btn.green{background:var(--l)}
.btn.red{background:var(--r);color:var(--w)}
.btn.dim{background:var(--d);color:var(--w)}
.btn:disabled{background:var(--e);color:var(--d);box-shadow:0 0 0 3px var(--d);cursor:not-allowed}
.btn.sm{font-size:9px;min-height:40px;padding:6px 8px}
.wide{width:calc(100% - 6px)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stack{display:flex;flex-direction:column;gap:10px}

/* windows */
.box{background:var(--n);border:3px solid var(--w);box-shadow:inset 0 0 0 3px var(--e);padding:12px;display:flex;flex-direction:column;gap:10px}
.box.dark{background:var(--e)}
.lbl{font-family:var(--px);font-size:9px;color:var(--y);text-transform:uppercase;letter-spacing:.04em}
h2{font-family:var(--px);font-size:14px;color:var(--y);line-height:1.5;text-wrap:balance}
.big{font-size:34px;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}

/* pixel canvases */
.pix{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--w);background:var(--k);max-width:100%}
.pix.tap{cursor:pointer}
.ico{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}

/* title */
.title{padding-top:20px;display:flex;flex-direction:column;gap:16px;text-align:center}
.logo{font-family:var(--px);font-size:clamp(44px,14vw,68px);line-height:1.15;color:var(--y);text-shadow:4px 4px 0 var(--r),8px 8px 0 var(--p)}
.tag{color:var(--s);max-width:32ch;margin:0 auto}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* hud */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--k);border-bottom:3px solid var(--w);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:auto auto auto 1fr auto auto;gap:10px;align-items:end}
.hs{display:flex;flex-direction:column;min-width:0}
.hs span{font-family:var(--px);font-size:7px;color:var(--s)}
.hs b{font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hs .cash{color:var(--y)}
.ib{font-family:var(--px);font-size:9px;padding:6px;border:3px solid var(--d);color:var(--s);min-height:34px;min-width:34px}
.due{font-size:18px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due.warm{color:var(--y)}
.due.hot{color:var(--o)}
.due .drk{color:var(--a)}

/* nav */
.top{display:flex;align-items:center;gap:10px;margin-top:2px}
.back{font-family:var(--px);font-size:10px;color:var(--s);padding:10px 8px 10px 0}
.top h2{flex:1}
.top small{color:var(--s);font-size:18px}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.loc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;font-family:var(--vt);font-size:18px;text-transform:none;line-height:1.1}
.loc .px{font-size:11px}
.note{background:var(--e);border:3px dashed var(--d);padding:10px;color:var(--y)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{font-family:var(--px);font-size:8px;padding:12px 2px;background:var(--e);border:3px solid var(--d);color:var(--s)}
.tab.on{background:var(--y);color:var(--k);border-color:var(--w)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--e);border:3px solid var(--d);padding:10px}
.row h3{font-family:var(--px);font-size:10px;line-height:1.5;color:var(--w)}
.row p{color:var(--s);font-size:18px;grid-column:1}
.row .btn{grid-row:1/3;grid-column:2}
.row.hot{border-color:var(--o)}
.row.got{border-color:var(--y);background:#2c3550}
.row.lock h3{color:var(--d)}
.kv{display:flex;justify-content:space-between;gap:10px}
.kv b{font-variant-numeric:tabular-nums}

/* stocks */
.stk{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--e);border:3px solid var(--d);padding:10px}
.stk h3{font-family:var(--px);font-size:10px;line-height:1.5}
.stk .pr{text-align:right;font-variant-numeric:tabular-nums}
.stk .pr b{display:block;font-size:24px;line-height:1}
.stk .acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stk .acts .btn{font-size:8px;min-height:38px;padding:4px 2px}
.spark{width:128px;height:40px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tipline{grid-column:1/-1;color:var(--a);font-size:18px}

/* skills */
.tree{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{display:flex;flex-direction:column;gap:6px}
.branch .lbl{margin-bottom:2px}
.node{background:var(--e);border:3px solid var(--d);padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px}
.node h3{font-family:var(--px);font-size:8px;line-height:1.5}
.node p{font-size:17px;color:var(--s)}
.node small{font-family:var(--px);font-size:7px;color:var(--y)}
.node.own{border-color:var(--l);background:#1f3b38}
.node.own small{color:var(--l)}
.node:disabled{opacity:.55;cursor:not-allowed}

/* casino */
.games{display:grid;grid-template-columns:1fr;gap:8px}
.gtile{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;background:var(--e);border:3px solid var(--d);padding:8px 10px;text-align:left;position:relative}
.gtile h3{font-family:var(--px);font-size:11px;color:var(--y);line-height:1.5}
.gtile p{font-size:18px;color:var(--s)}
.gtile:disabled{opacity:.5;cursor:not-allowed}
.gtile .done{position:absolute;top:6px;right:8px;font-family:var(--px);font-size:7px;color:var(--l)}

/* tables */
.felt{background:var(--felt,var(--g));border:3px solid var(--k);box-shadow:inset 0 0 0 3px var(--t),0 0 0 3px var(--o);margin:3px;padding:14px 10px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.felt.dark{background:var(--n);box-shadow:inset 0 0 0 3px var(--b),0 0 0 3px var(--s)}
.msg{text-align:center;min-height:24px;font-size:20px}
.msg em{font-style:normal;color:var(--a)}
.hand{display:flex;flex-direction:column;gap:6px;align-items:center}
.hlab{font-family:var(--px);font-size:8px;color:var(--w)}
.cards{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:64px}
.cardf{width:44px;height:62px;background:var(--w);color:var(--k);border:3px solid var(--k);box-shadow:3px 3px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;font-family:var(--px);font-size:11px}
.cardf .su{align-self:flex-end;font-family:var(--vt);font-size:30px;line-height:.75}
.cardf.red{color:var(--r)}
.cardb{width:44px;height:62px;border:3px solid var(--w);background:repeating-conic-gradient(var(--cb1,var(--r)) 0 25%,var(--cb2,var(--p)) 0 50%) 0 0/8px 8px;box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.cslot{width:44px;height:62px;border:3px dashed rgba(244,244,244,.35)}
.ph{color:var(--w);opacity:.75;font-size:18px;align-self:center}
.hint{text-align:center;color:var(--a);font-size:19px}

/* bet bar */
.betbar{background:var(--e);border:3px solid var(--d);padding:8px;display:flex;flex-direction:column;gap:8px}
.betval{display:flex;justify-content:space-between;align-items:baseline}
.betval b{font-size:28px;color:var(--y);line-height:1;font-variant-numeric:tabular-nums}
.betval{gap:8px;align-items:center}
.betin{display:flex;align-items:center;gap:2px;font-size:28px;color:var(--y)}
.betin input{width:8.5ch;font-family:var(--vt);font-size:28px;line-height:1;color:var(--y);background:var(--k);border:3px solid var(--d);padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;border-radius:0}
.betin input:focus{outline:none;border-color:var(--y)}
.betin input:disabled{opacity:.5}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.chip{font-family:var(--px);font-size:9px;min-height:40px;background:var(--n);border:3px solid var(--s);color:var(--w)}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* choice buttons */
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{font-family:var(--px);font-size:9px;line-height:1.5;padding:8px 2px;background:var(--e);border:3px solid var(--d);display:flex;flex-direction:column;align-items:center;gap:2px}
.opt small{font-family:var(--vt);font-size:16px;color:var(--s)}
.opt.on{background:var(--n);border-color:var(--y);color:var(--y)}
.opt.prev{border-color:var(--a);color:var(--a)}
.wbar .wrow{display:flex;gap:10px;align-items:center}.wbar .wpic{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:96px}.wbar .winfo{min-width:0;display:flex;flex-direction:column;gap:2px}.wbar .winfo b{font-size:11px;color:var(--y)}.wbar .winfo small{font-family:var(--vt);font-size:17px;color:var(--s);line-height:1.1}.wfelt{width:96px;height:72px;border:3px solid var(--k);box-shadow:inset 0 0 0 3px var(--t);display:grid;place-items:center}.wfelt .cardb{width:30px;height:42px}
.opt:disabled{opacity:.5;cursor:not-allowed}
.o-red{color:var(--o)}
.o-zero{color:var(--l)}
.stepper{display:flex;justify-content:center;align-items:center;gap:14px}
.stepper b{font-size:34px;min-width:52px;text-align:center}

/* roulette / coin */
.wheel{width:112px;height:112px;margin:0 auto;display:grid;place-items:center;font-family:var(--px);font-size:30px;background:var(--e);border:6px solid var(--k);box-shadow:0 0 0 4px var(--y),inset 0 0 0 4px var(--o);clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.wheel.r{background:var(--r)}.wheel.b{background:var(--k)}.wheel.z{background:var(--g)}
.hist{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:22px}
.hist i{font-style:normal;font-family:var(--px);font-size:8px;min-width:24px;height:20px;padding:0 3px;display:grid;place-items:center}
.hist .r{background:var(--r)}.hist .b{background:var(--k)}.hist .z{background:var(--g)}.hist .m{background:var(--e)}.hist .m.lose{color:var(--o)}
.coin{width:104px;height:104px;margin:0 auto;display:grid;place-items:center;font-family:var(--px);font-size:34px;background:var(--y);color:var(--o);border:6px solid var(--o);box-shadow:inset -6px -6px 0 rgba(0,0,0,.18);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.coin.t{background:var(--s);color:var(--d);border-color:var(--d)}

/* mines */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:330px;width:100%;margin:0 auto}
.mcell{aspect-ratio:1;background:var(--e);border:3px solid var(--d);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3);font-family:var(--px);font-size:16px}
.mcell:disabled{cursor:default}
.mcell.gem{background:var(--t);border-color:var(--a);color:var(--a)}
.mcell.mine{background:var(--p);color:var(--o)}
.mcell.boom{background:var(--o);color:var(--k)}
.mopts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

/* poker */
.pk{gap:12px;padding:12px 8px}
.pkrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pkrow .cards{min-height:0;flex-wrap:nowrap}
.pkwho{display:flex;flex-direction:column;gap:2px;min-width:0}
.pkwho b{font-family:var(--px);font-size:11px;display:flex;align-items:center;gap:6px}
.pkwho span{font-size:18px;color:var(--w)}
.dchip{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;background:var(--w);color:var(--k);font-family:var(--px);font-size:8px}
.board{display:flex;gap:4px;justify-content:center}
.board .cardf,.board .cslot{width:min(44px,16vw)}
.pot{text-align:center;font-family:var(--px);font-size:10px;color:var(--y)}
.odds{background:var(--k);border:3px solid var(--y);padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.odds b{color:var(--y);font-size:24px}
.odds .po{flex-basis:100%;color:var(--s);font-size:17px}
.pklog{font-size:17px;color:var(--s);display:flex;flex-direction:column;gap:2px}
.raises{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* misc */
.ending{text-align:center;display:flex;flex-direction:column;gap:12px;padding:20px 12px;border:3px solid var(--o);box-shadow:inset 0 0 0 3px var(--p);background:var(--e)}
.ending h1{font-family:var(--px);font-size:clamp(26px,9vw,40px);color:var(--o);line-height:1.3}
.confirm{background:var(--p);border:3px solid var(--o);padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.ticket{background:var(--w);color:var(--k);border:3px dashed var(--r);padding:10px;text-align:center;font-size:22px}
.ticket b{font-family:var(--px);font-size:16px;color:var(--r)}
table.odd{width:100%;border-collapse:collapse;font-size:19px}
table.odd td{padding:4px 2px;border-bottom:2px solid var(--e)}
table.odd td:last-child{text-align:right}
.lvl{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--px);font-size:9px;color:var(--y)}
.xpbar{flex:1;max-width:170px;height:14px;border:3px solid var(--w);background:var(--k)}
.xpbar i{display:block;height:100%;background:var(--l)}
.prog{grid-column:1/-1;height:10px;border:2px solid var(--d);background:var(--k);margin-top:4px}
.prog i{display:block;height:100%;background:var(--y)}
.linkb{color:var(--a);text-decoration:underline;font-size:18px;padding:4px 0}
.pad{display:grid;grid-template-columns:62px 1fr 62px;gap:6px;align-items:stretch;touch-action:none;-webkit-user-select:none;user-select:none}
.padb{font-family:var(--px);font-size:20px;min-height:58px;background:var(--e);border:3px solid var(--w);color:var(--w);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35);touch-action:none;-webkit-user-select:none;user-select:none}
.padb:active{background:var(--n);color:var(--y)}
.btn.act{font-size:10px;min-height:58px;text-transform:none;line-height:1.5}
canvas.world{touch-action:none;-webkit-user-select:none;user-select:none}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.seat{display:flex;justify-content:space-between;align-items:center;gap:4px;background:var(--e);border:3px solid var(--d);padding:5px 6px;min-width:0}
.seat .si{min-width:0;display:flex;flex-direction:column}
.seat b{font-family:var(--px);font-size:8px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat b em{font-style:normal;color:var(--y)}
.seat span{font-size:16px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .hn{color:var(--a)}
.seat.turn{border-color:var(--y);background:var(--n)}
.seat.out{opacity:.5}
.seat.won{border-color:var(--l)}
.mcs{display:flex;gap:2px;flex:none}
.mc{width:20px;height:28px;background:var(--w);color:var(--k);border:2px solid var(--k);font-family:var(--px);font-size:7px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mc.red{color:var(--r)}
.dbt{display:grid;grid-template-columns:18px repeat(8,1fr) 24px;gap:2px;align-items:center}
.dbc{height:32px;display:grid;place-items:center;background:rgba(0,0,0,.16)}
.dbc.gate{background:rgba(0,0,0,.35)}
.dbc.fin{background:repeating-conic-gradient(rgba(255,255,255,.35) 0 25%,rgba(0,0,0,.35) 0 50%) 0 0/8px 8px}
.dbl{font-family:var(--vt);font-size:20px;text-align:center;color:var(--w)}
.dbl.me{color:var(--y)}
.dbp{font-family:var(--px);font-size:7px;color:var(--y)}
.dbh.hit{background:var(--o);animation:dbhit .4s steps(2) 2}
.dbh.won{box-shadow:0 0 0 2px var(--y)}
@keyframes dbhit{50%{transform:translateX(-3px)}}
.dbdeck{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--vt);font-size:18px;color:var(--w)}
.dbdeck span:nth-child(2){flex:1}
.dbdeck small{font-family:var(--px);font-size:7px;color:var(--s)}
.mb{display:block;width:20px;height:28px;border:2px solid var(--w);background:repeating-conic-gradient(var(--cb1,var(--r)) 0 25%,var(--cb2,var(--p)) 0 50%) 0 0/6px 6px}
.hand.cur{outline:3px dashed var(--y);outline-offset:4px}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--k);border:3px solid var(--y);padding:8px}
.reel{height:80px;display:grid;place-items:center;background:var(--w);color:var(--k);font-family:var(--px);font-size:26px;border:3px solid var(--d)}
.reel.s7,.reel.sh{color:var(--r)}.reel.sd{color:var(--g)}.reel.sst{color:var(--o)}.reel.sbar{font-size:15px}
.paytable{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px;font-size:16px;color:var(--w)}
.paytable span{display:flex;justify-content:space-between;gap:4px}
.paytable b{color:var(--y)}

  }

  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;const cv=fxCanvas(),x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
    FXP=FXP.filter(p=>(p.life-=dt)>0);
    for(const p of FXP){if(!p.ng)p.vy+=150*dt;else{p.vx*=.96;p.vy*=.96}p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph=(p.ph||0)+dt*11;

      else if(p.k==='spark'){x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),2,2)}
      else if(p.k==='shard'){x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),Math.max(1,Math.round(Math.abs(Math.sin(p.ph))*4)),2)}

}

function questEvent(type,p){

  else if(q.k==='sp'&&type==='sp'&&p===q.sp)inc=1;
  else if(q.k==='profit'&&type==='win')inc=p.net;
  else if(q.k===type&&['pay','drink','buy','zora','pawn','stockbuy','stockwin','sbbet','nap'].includes(type))inc=1;
  else if(type==='play'&&q.k==='bets')inc=1;
  else if(type==='play'&&q.k==='wager')inc=p.b||0;
  else if(type==='settle'){
    if(q.k==='streak'&&S.wstreak>=q.goal)q.prog=q.goal;
    else if(q.k==='big5'&&p.net>0&&p.mult>=5)inc=1;
    else if(q.k==='bold'&&p.net>0&&p.share>=.25)inc=1;
    else if(q.k==='comeback'&&p.net>0&&p.ls>=3)inc=1;
    else if(q.k==='tables'&&p.net>0){q.gs=q.gs||[];if(!q.gs.includes(p.game))q.gs.push(p.game);q.prog=q.gs.length}}
  if(q.k==='variety'&&type==='play')q.prog=S.today.games.length;
  q.prog+=inc;
  if(q.prog>=q.goal){q.done=true;setTimeout(()=>{note('QUEST DONE · <b>Go see Lucky Lou outside the casino</b>');SFX.ach()},1100)}
}

function settle(game,bet,gross,noMast){

  questEvent('settle',{game,net,mult:bet>0?g0/bet:0,share:bet/Math.max(1,cb+bet),ls:ls0});
  if(net>0){S.today.won=(S.today.won||0)+net;questEvent('win',{game,net});if(!noMast)addGameWin(game)}
  if(net>0){ach('first');S.stats.won+=net;if(net>S.stats.biggest)S.stats.biggest=net;const st=gs(game);st.w++;if(net>st.big)st.big=net;passCheck(game);M.stats.wins++;if(net>M.stats.big)M.stats.big=net;}

  checkCash();checkTiers();save();
  return{net,note};
}

const DB_TR=6,DB_FIN=7,DB_PAY={win:3.8,place:1.9},DB_NM=['Spades','Hearts','Diamonds','Clubs'];
function dbRace(){const deck=[];for(let su=0;su<4;su++)for(let r=2;r<=13;r++)deck.push({r,s:su});for(let i=deck.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  const track=deck.splice(0,DB_TR),pos=[0,0,0,0],rev=Array(DB_TR).fill(false),fin=[],ev=[];
  while(fin.length<2&&deck.length){const c=deck.shift(),e={c,bk:[],left:deck.length};
    if(!fin.includes(c.s)){pos[c.s]++;if(pos[c.s]>=DB_FIN){fin.push(c.s);e.done=c.s}
      else for(let k=0;k<DB_TR;k++){if(rev[k])continue;const run=pos.filter((p,i)=>!fin.includes(i));if(Math.min(...run)>k){rev[k]=true;const t=track[k].s,mv=!fin.includes(t)&&pos[t]>0;if(mv)pos[t]--;e.bk.push({k,s:t,mv})}}}
    e.pos=pos.slice();e.rev=rev.slice();e.fin=fin.slice();ev.push(e)}
  if(fin.length<2){[0,1,2,3].filter(i=>!fin.includes(i)).sort((a,b)=>pos[b]-pos[a]).forEach(i=>{if(fin.length<2)fin.push(i)});ev[ev.length-1].fin=fin.slice()}
  return{track,ev,fin}}
function dbBoard(s){const lane=i=>{const p=s.pos[i],me=s.bets&&(s.bets['w'+i]||s.bets['p'+i]),done=s.fin.indexOf(i);
    return`<span class="dbl ${me?'me':''}">${SU[i]}</span>`+Array.from({length:DB_FIN+1},(_,j)=>`<span class="dbc ${j===0?'gate':''} ${j===DB_FIN?'fin':''}">${j===p?`<span class="mc dbh ${i===1||i===2?'red':''} ${s.flash===i?'hit':''} ${done>=0?'won':''}">A<br>${SU[i]}</span>`:''}</span>`).join('')+`<span class="dbp">${done===0?'1st':done===1?'2nd':''}</span>`};
  const trk=`<span class="dbl"></span><span class="dbc gate"></span>`+Array.from({length:DB_TR},(_,k)=>`<span class="dbc">${s.track[k]&&s.rev[k]?miniFace(s.track[k]):'<span class="mb"></span>'}</span>`).join('')+`<span class="dbc fin"></span><span class="dbp"></span>`;
  return`<div class="dbt">${trk}${[0,1,2,3].map(lane).join('')}</div><div class="dbdeck">${s.last?miniFace(s.last):'<span class="mb"></span>'}<span>${s.tick||'Stack chips on Win or Place, then race.'}</span><small>${s.left} left</small></div>`}
function dbAct(v){
  const s=chipFix(S.g.db);if(s.busy)return;
  if(/^[wp][0-3]$/.test(v)){chipAdd('db',v);return}
  if(v!=='go')return;const b=chipStart('db');if(!b)return;const bets=Object.assign({},s.bets);s.busy=true;s.k=(s.k||0)+1;
  const R=dbRace(),knocked=[0,0,0,0];
  Object.assign(s,{pos:[0,0,0,0],track:R.track,rev:Array(DB_TR).fill(false),fin:[],last:null,left:48-DB_TR,flash:-1,tick:'And they’re off!',msg:''});
  const apply=e=>{s.pos=e.pos;s.rev=e.rev;s.fin=e.fin;s.last=e.c;s.left=e.left;s.flash=-1;
    const hit=e.bk.find(x=>x.mv);if(e.bk.length){const x=hit||e.bk[0];s.tick=`Track card ${x.k+1} flips: ${SU[x.s]} ${x.mv?'knocked back!':'no effect.'}`;if(hit){s.flash=hit.s;knocked[hit.s]++}}
    else if(e.done!=null)s.tick=`${SU[e.done]} ${DB_NM[e.done]} cross${s.fin.length===1?'es first!':' in second.'}`;
    else s.tick=s.fin.includes(e.c.s)?`${SU[e.c.s]} already finished.`:`${SU[e.c.s]} moves up.`;return!!hit};
  const fin=pendFin(()=>{s.busy=false;s.flash=-1;let g=0;const won=[];let backWin=false;
    for(const k in bets){const i=+k[1],ok=k[0]==='w'?R.fin[0]===i:R.fin.slice(0,2).includes(i);if(ok){g+=bets[k]*DB_PAY[k[0]==='w'?'win':'place'];won.push(SU[i]+(k[0]==='w'?' win':' place'));if(knocked[i])backWin=true}}
    const r=settle('derby',b,g);s.hist.unshift(SU[R.fin[0]]);s.hist=s.hist.slice(0,10);
    s.msg=`${SU[R.fin[0]]} wins, ${SU[R.fin[1]]} places. `+chipWins(won)+resText(r);if(won.length){questEvent('sp','derby_win');if(backWin)ach('derby')}save();render()});
  if(RM){R.ev.forEach(apply);fin();return}
  render();let i=0;const step=()=>{if(i>=R.ev.length){setTimeout(fin,350*SP());return}const e=R.ev[i++],hit=apply(e);const el=$('#dbtrack');if(el)el.innerHTML=dbBoard(s);
    if(hit)SFX.thunk();else SFX.tick();const close=Math.max(...s.pos)>=DB_TR-1;setTimeout(step,(hit?1200:e.done!=null?950:e.bk.length?800:close?620:400)*SP())};
  SFX.bugle();setTimeout(step,1500*SP());
}

  <p><b class="px" style="font-size:10px;color:var(--y)">DEBTS GROW.</b> Paying a debt brings in a new one, due a couple of days later, along with the next chapter of your story. Each new debt is sized from the debt ladder and your balance when you pay (cash, stocks, chips on the table and open bets): the more you\u2019re holding, the more they want, between 60% and 200% of the ladder amount. Every Heat tier has its own 30-chapter storyline, with a cutscene showing how each debt happened. Your place in each storyline carries over between runs. Clearing a Heat (all 10 debts) for the first time plays its ending, finishing a storyline plays its finale, and clearing Heat 30 plays something special.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">BUS.</b> The bus runs between your home and the stop by the casino, skipping the long walk. It drops you right next to Lucky Lou.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">ENERGY.</b> You get ${maxEnergy()} energy a day (50 to start). Longer games cost more per round: ${['holdem','slots','flip','baccarat','roulette','crash','snail','bj','mines','tower','hilo'].map(g=>GAMES[g].n+' '+ecost(g)).join(', ')}. Craps costs ${ECOST.craps} per come-out, Plinko ${ECOST.plinko} per session and a Sit & Go ${SNG_E}. Sports bets and stock trades are free. Every game shows its cost at the top. Sleep to refill, or buy a Volt Energy at the Pawn King’s counter.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">THE PAWN KING.</b> His display case sells items that last the whole run: more energy, bigger wins, cheaper shopping and smarter play. Some build on each other, so you need the first one before the next. He buys anything back at half price. After you sleep, the ledger charts your day: what you won, what bonuses added, what you lost and what bonuses saved.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">GETTING AROUND.</b> Walk with the arrow buttons (or arrow keys), or tap where you want to go. Press the big button to use whatever you’re standing next to: doors, your computer, your bed, the Pawn King, the bartender and every casino game.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">MAIN STREET.</b> Lucky Lou is there from day 1. The rest of Main Street opens as you pay debts, the same way every run: the Pawn King & Loans at 1 debt paid, the Bar and the Pawn King’s display case at 2, the Pawn King’s counter (energy drinks and daily specials) at 3 and Madame Zora at 5. Every building is walk-in: go through the door, and walk back out the door to leave. Your computer\u2019s Town tab shows what\u2019s open on Main Street.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">AROUND TOWN.</b> Lucky Lou, right outside the casino, hands out a new quest every day. Finish it and walk back to him for a reward: cash, a Hot Streak or Safety Net for tomorrow, extra energy, a smaller debt and more. Further down Main Street: the Pawn King sells run-long trinkets plus energy drinks and rotating daily specials at his counter, and Vinnie lends cash at 30% from his window in the back, and Madame Zora blesses one game per day.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">BETS.</b> Every bet panel has Clear, Repeat (your last bet in that game) and Double. At roulette, Repeat last and Double last rebuild your previous spin’s whole layout.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">UNLOCKS.</b> Blackjack, Roulette, Craps and Baccarat are always open on day 1, plus 4 random games. Paying off debts opens the rest, two at a time, until every game is open by your 8th debt.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">MASTERY.</b> Every win at a game counts toward its tier across all your runs: Bronze, Silver, Gold, Emerald, Ruby and Diamond. Higher tiers restyle that game\u2019s cards and table, put a gem on its casino sign and unlock cosmetics. Up to 150 wins per game count in a single run, so tiers can\u2019t be farmed in one sitting. Table minimums grow with your next debt: day-1 games ask about 2% of it, the last games up to 6%, plus 3% per Heat. When cash runs low, only the cheap tables will take you. Plinko costs ${ECOST.plinko} energy per session and has Low, Normal and High risk boards.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">CRAPS.</b> Bet the Pass Line and roll the come-out: 7 or 11 wins, 2, 3 or 12 loses, anything else sets the point. Roll the point again before a 7 to win. Back it with Odds (true odds, no house edge), add Come, Place, Field, hard ways and one-roll props. The come-out roll costs ${ECOST.craps} energy, and every roll after it is free until the shooter sevens out or makes the point.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">SPORTSBOOK.</b> Bet from the Sports tab on your home computer. Every day has a slate of games across basketball, baseball, soccer, tennis, football and hockey. Odds are shown as each side\u2019s chance to win. Pick one side for a single bet, or 2 to 6 sides for a parlay that pays the multipliers stacked together. Slips cost no energy, just like stocks. The games are played overnight and bets settle when you wake up. Lie down in bed to watch the games you bet on before you fall asleep.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">BROKE?</b> When you have no cash, nothing to pawn, no loan left and no bets out, a Face the Collectors button appears so you can end the run on your own terms. If Vinnie will still lend, you get the choice: borrow or face them.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">SHUFFLED CASINO.</b> Every run deals a new casino lineup: which games are open on day 1 and which unlock as you pay off debts is random. Win a game enough times and you earn its day-one pass, which guarantees it a starting slot.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">STOCKS.</b> Four stocks move once a night. Buy to bet on a rise, or short to bet on a fall. An Insider Tip from the Pawn King’s counter (when it’s that day’s special) shows tomorrow’s move for one random stock.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">THE BAR.</b> A drink multiplies the profit on your next win, from 0.1x up to 3x.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">POKER.</b> Pick your stakes at a cash table, or enter a Sit & Go: 8 players (top 3 paid), 6 players (top 2) or 3 players (winner takes all). Each player has a style (Fish, Loose, Rock, Maniac, Pro, and Gus the Shark); tap a seat to read them. Each cash-game hand costs 1 energy. A Sit & Go costs ${SNG_E} energy to enter, then its hands are free. A full 8-handed table with a real 52-card deck and side pots. Your odds against the players still in the hand come from simulating thousands of run-outs, and all-in odds are exact once one or two cards are left to come.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">REP &amp; LEGACY.</b> Every run pays a little Rep when it ends. Leveling up and trophy ladders pay a little more. Legacy upgrades are expensive on purpose: it takes many runs before they really change the game. Trophies and wardrobe items carry across every run and Heat.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">HEAT.</b> Each run has 10 debts. Pay them all to clear the Heat; clear your highest Heat to unlock the next, up to 30. Higher Heat means bigger debts that grow faster, a house cut of 0.1% per Heat on every win’s profit, and more Rep.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">STACKING BONUSES.</b> Legacy and pawn shop items stack with diminishing returns: together they top out near +8% on wins and 3% back on losses. Short boosts like the Lucky Charm, Hot Streak and Madame Zora stack on top, but every bonus together stops at +12% on wins and 4% back on losses, so even a perfect build only edges past the house by a hair, and no stack of boosts, drinks and wishes can pay more than 3x profit on one win. Debt discounts from Legacy and items stack too, but never past 40% off. Every game still has a house edge before bonuses, so no build guarantees a win. The Boosts tab shows what yours work out to.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">CONTRACTS.</b> Optional rules that make a run harder for more Rep. New ones unlock as your lifetime Rep grows.</p>
  <p class="muted">Play money only. Progress saves on this device.</p><span class="lbl">Game guides</span><p class="muted">Rules and payouts for every game. You can also open these from the top of any game screen.</p>${GAME_IDS.map(g=>`<details class="gdet"><summary>${GAMES[g].n}</summary>${guideHTML(g)}</details>`).join('')}</div>`}

    case 'rlpick':rlPlace(v);return;
    case 'rlcancel':UI.rlPick=null;break;
    case 'rlmode':S.g.rl.mode=v;UI.rlPick=null;break;
    case 'rldel':delete S.g.rl.bets[v];break;
    case 'rlclear':S.g.rl.bets={};S.g.rl.stack=[];UI.rlPick=null;break;
    case 'rlundo':{const s=S.g.rl;if(s.busy)return;const x=(s.stack||[]).pop();if(x){s.bets[x[0]]=(s.bets[x[0]]||0)-x[1];if(s.bets[x[0]]<=0)delete s.bets[x[0]];SFX.tick()}UI.rlPick=null;break}
    case 'rldouble':{const s=S.g.rl,t=rlTotal();if(t*2>S.cash||(mod('low')&&t*2>lowCap())){toast('Not enough room to double.');return}for(const k in s.bets)s.bets[k]*=2;break}
    case 'rlspin':rlSpin();return;
    case 'pkmode':UI.pkMode=v;break;
    case 'plrisk':if(!S.g.pl.busy)S.g.pl.risk=v;break;
    case 'plballs':if(!S.g.pl.busy)S.g.pl.balls=+v;break;
    case 'sngsize':UI.sngSize=+v;break;
    case 'cpbet':cpBet(v);return;
    case 'cproll':cpRoll();return;
    case 'cptake':cpTakeDown();return;
    case 'cpundo':cpUndo();return;
    case 'sbtab':UI.sbTab=v;break;
    case 'sbpick':{const [i,p]=v.split(':');sbPick(+i,p);break}
    case 'sbplace':sbPlace();break;
    case 'sbwatch':if(UI.scene==='tonight')sbWatch(+v);return;
    case 'sbskip':if(SBW)sbFinish();return;
    case 'sbclose':UI.sbLast=null;break;
    case 'hl':hlAct(v);return;
    case 'sc':scAct(v);return;
    case 'dc':dcAct(v);return;
    case 'wr':wrAct(v);return;
    case 'sbo':sboAct(v);return;
    case 'db':dbAct(v);return;
    case 'guide':UI.guide=UI.guide===UI.game?null:UI.game;break;
    case 'intronext':UI.introP=1;break;
    case 'introback':UI.introP=0;render();introStart();return;
    case 'introskip':UI.scene='world';UI.room='home';INTRO=null;save();render();toast('Home sweet home. Your computer has your debts, stocks and sports bets.');return;
    case 'cppress':cpPress(v);return;
    case 'qview':UI.qview=!UI.qview;break;
    case 'nap':napAct();break;
    case 'tierinfo':toast(`Every win at ${GAMES[UI.game].n} counts toward its tier, across all your runs: ${TIERS.map((t,i)=>t[0]+' '+tierNeed(UI.game,i)).join(', ')}. Up to ${MAST_DAY} wins per game count each day (${(S.today.mw&&S.today.mw[UI.game])||0} so far today).`);return;
    case 'pkstake':P().stake=+v;{const bb=STAKES[+v][1];UI.bet=Math.min(Math.floor(S.cash),bb*50)}break;
    case 'pkread':{const p=P().seats[+v];if(p&&!p.out){const st=PK_STY[p.sk||'pro'];toast(`<b>${p.n}</b> · ${st.n}: ${st.d}`)}return}
    case 'rlrep':case 'rldbl':{const s=S.g.rl,f=a==='rldbl'?2:1,lb=s.lastBets||{},t=Object.values(lb).reduce((x,y)=>x+y,0)*f;if(!t)return;if(t>S.cash||(mod('low')&&t>lowCap())){toast(`That layout costs ${fmt(t)}. Not enough cash.`);return}s.bets={};s.stack=[];for(const k in lb){s.bets[k]=lb[k]*f;s.stack.push([k,lb[k]*f])}SFX.coin();break}
    case 'betclr':UI.bet=0;break;
    case 'betrep':case 'betdbl':{const lb=(S.lastBet||{})[UI.game];if(!lb)return;let v=lb*(a==='betdbl'?2:1);const cap=Math.floor(Math.min(S.cash,mod('low')?lowCap():Infinity));if(v>cap){toast(`Only ${fmt(cap)} available, so your bet is set to that.`);v=cap}UI.bet=v;break}
    case 'qclaim':claimQuest();break;
    case 'tbuy':{const p=tprice(v);const rq=TRINKETS[v]&&TRINKETS[v].req;if((S.paid||0)<PAWN_CASE||S.trinkets[v]||S.cash<p||(rq&&!S.trinkets[rq]))return;{ach('skill');setTimeout(()=>{if(S&&Object.keys(S.trinkets).length>=8)ach('tree')},0)}S.cash-=p;S.trinkets[v]=p;questEvent('pawn');SFX.coin();toast(`Bought the ${TRINKETS[v].n}.`);if(Object.keys(S.trinkets).length>=4)ach('collector');break}
    case 'tsell':{const p=S.trinkets[v];if(!p||Object.keys(S.trinkets).some(x=>TRINKETS[x]&&TRINKETS[x].req===v)){if(p)toast('Sell the item that builds on it first.');return}S.cash+=Math.round(p/2);delete S.trinkets[v];SFX.coin();toast(`The Pawn King gives you ${fmt(Math.round(p/2))} for the ${TRINKETS[v].n}.`);break}
    case 'pawnitem':{if(S.pawned[v])return;S.pawned[v]=1;S.cash+=HOUSE[v][1];SFX.coin();toast(`The Pawn King gives you ${fmt(HOUSE[v][1])} for ${HOUSE[v][0].toLowerCase()}.`);break}
    case 'zora':zoraAct();break;
    case 'ride':{UI.panel=null;flash('rgba(26,28,44,.9)',500);SFX.thunk();UI.wx.street=v==='casino'?SX(560):52;UI.scene='world';UI.room='street';toast(v==='casino'?'The 7 Express drops you at the stop by the casino. Lucky Lou is right there.':'The bus drops you outside your apartment.');break}
    case 'loan':UI.confirm=null;loanAct(+v);break;
    case 'pldrop':plDrop();return;
    case 'mn':mnAct(v,el.dataset.i);return;
    case 'fl':flAct(v);return;
    case 'snpick':chipAdd('sn',+v);return;
    case 'snrace':snRace();return;
    case 'sl':slSpin();return;
    case 'wh':whSpin();return;
    case 'whpick':chipAdd('wh',v);return;
    case 'bc':bcPlay();return;
    case 'bcpick':chipAdd('bc',v);return;
    case 'chundo':chipUndo(v);return;
    case 'chclear':chipClear(v);return;
    case 'cr':crStart();return;
    case 'crcash':crCash();return;
    case 'crauto':S.g.cr.auto=+v;break;
    case 'tw':twAct(v,el.dataset.i);return;
    case 'kn':knAct(v,el.dataset.i);return;
    case 'vp':vpAct(v,el.dataset.i);return;
    case 'pg':pgAct(v,el.dataset.i);return;
    case 'pk':
      if(v==='sit'){const ps=P(),bb=STAKES[ps.stake||0][1];let b=clampBet();if(S.energy<1){toast('Each cash hand costs 1 energy. You’re out.');return}if(b<bb*20){if(S.cash>=bb*20){b=bb*20;toast(`Minimum buy-in at this table is ${fmt(bb*20)}.`)}else return}if(b>bb*100){b=bb*100;toast(`Maximum buy-in at this table is ${fmt(bb*100)}.`)}pkSit(b,'cash');return}
      if(v==='tour'){const b=clampBet();if(S.energy<SNG_E){toast(`A Sit & Go takes ${SNG_E} energy.`);return}if(b<20){toast('Sit & Go buy-in is at least <b>$20</b>.');return}pkSit(b,'tour',UI.sngSize||8);return}
      if(v==='forfeit'){pkForfeit();return}
      if(v==='deal'){pkDeal();return}
      if(v==='leave'){pkLeave();return}
      if(v==='fold'){pkAction(0,'fold');return}if(v==='call'){pkAction(0,'call');return}if(v==='raise'){pkAction(0,'raise',+el.dataset.i);return}return;
  }
  save();render();
  if(UI.scene!==lastScene){window.scrollTo(0,0);lastScene=UI.scene}
}
const QUIET=['pkread','boost','bj','rlspin','rlnum','rlout','rlpick','pldrop','mn','fl','snrace','pk','sl','wh','bc','cr','crcash','tw','kn','vp','pg','interact'];
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const big=needsConfirm(b.dataset.a,b.dataset.v);if(big){SFX.click();showBigConfirm(b.dataset.a,b.dataset.v,b.dataset.i,big);return}
  if(!QUIET.includes(b.dataset.a))SFX.click();
  act(b.dataset.a,b.dataset.v,b);
});
app.addEventListener('pointerdown',e=>{
  if(UI.scene!=='world')return;
  const mb=e.target.closest('[data-move]');
  if(mb){e.preventDefault();UI.move=+mb.dataset.move;UI.target=null;UI.pending=null;startLoop();return}
  const cv=e.target.closest('canvas[data-s="world"]');
  if(cv){e.preventDefault();const r=cv.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*160,wx=camX()+X,w=roomW(UI.room);
    let sp=null,bd=16;for(const s of roomSpots(UI.room)){const d=Math.abs(s.x-wx);if(d<bd){bd=d;sp=s}}
    UI.target=sp?sp.x:Math.max(8,Math.min(w-8,wx));UI.pending=sp?sp.id:null;startLoop()}
});
app.addEventListener('input',e=>{const sk=e.target.dataset&&e.target.dataset.set;if(sk){M.set[sk]=e.target.value/100;const o=$('#setv-'+sk);if(o)o.textContent=e.target.value;applyVolumes();return}if(e.target.id!=='betin')return;const d=e.target.value.replace(/[^0-9]/g,'');if(d!==e.target.value)e.target.value=d;UI.bet=parseInt(d,10)||0});
app.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.set){save();if(e.target.dataset.set!=='music')SFX.coin();return}if(e.target.id!=='betin')return;const b=clampBet();UI.bet=b;e.target.value=b;save()});
app.addEventListener('keydown',e=>{if(e.target.id==='betin'&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
app.addEventListener('focusin',e=>{if(e.target.id==='betin'){try{e.target.select()}catch(_){}}});
const stopMove=()=>{UI.move=0};
window.addEventListener('pointerup',stopMove);window.addEventListener('pointercancel',stopMove);window.addEventListener('blur',stopMove);
app.addEventListener('contextmenu',e=>{if(e.target.closest('[data-move],canvas[data-s="world"]'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(UI.scene!=='world'||e.repeat&&!['ArrowLeft','ArrowRight'].includes(e.key))return;
  if(e.key==='ArrowLeft'||e.key==='a'){UI.move=-1;UI.target=null;startLoop();e.preventDefault()}
  else if(e.key==='ArrowRight'||e.key==='d'){UI.move=1;UI.target=null;startLoop();e.preventDefault()}
  else if((e.key===' '||e.key==='ArrowUp'||e.key==='Enter')&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('button'))){const sp=nearSpot();if(sp){e.preventDefault();interact(sp.id)}}
});
document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))UI.move=0});
window.addEventListener('resize',()=>{fitPix();drawScenes()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitPix()});
applySettings();render();lastScene=UI.scene;
if(S&&S.awayNote){const a=S.awayNote;delete S.awayNote;save();setTimeout(()=>toast(`Your ${GAMES[a.g]?GAMES[a.g].n:'last'} round finished while you were away: <b class="${a.net>0?'win':a.net<0?'lose':''}">${a.net>0?'+':a.net<0?'-':''}${fmt(Math.abs(a.net))}</b>.`),700)}
})();
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});let __lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-__lt<350&&!(e.target&&e.target.matches&&e.target.matches('input')))e.preventDefault();__lt=n},{passive:false});
</script>
